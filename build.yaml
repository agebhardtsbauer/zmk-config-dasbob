---
include:
  # Left half (nice!nano) — peripheral (use this build if you're also
  # flashing the Prospector dongle as central)
  - board: nice_nano//zmk
    shield: dasbob_left
    cmake-args: -DCONFIG_ZMK_USB=n -DCONFIG_ZMK_SLEEP=y
    artifact-name: dasbob_left

  # Left half (nice!nano) — standalone central (use this instead, with no
  # dongle, to pair the two halves directly to your computer over BLE)
  - board: nice_nano//zmk
    shield: dasbob_left
    cmake-args: -DCONFIG_ZMK_USB=n -DCONFIG_ZMK_SLEEP=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
    artifact-name: dasbob_left_standalone

  # Right half (nice!nano) — peripheral (same firmware works whether the
  # central is the Prospector dongle or the standalone left half above)
  - board: nice_nano//zmk
    shield: dasbob_right
    cmake-args: -DCONFIG_ZMK_USB=n -DCONFIG_ZMK_SLEEP=y
    artifact-name: dasbob_right

  # Bond-reset firmware for either half, if pairing ever needs a clean slate
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: dasbob_settings_reset

  # Prospector (xiao_ble) — central + display
  - board: xiao_ble//zmk
    shield: dasbob_dongle prospector_adapter
    artifact-name: dasbob_prospector_dongle

  # Bond-reset firmware for the Prospector
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: prospector_settings_reset
