# Dongle (Prospector) is central and connects to two peripherals (left, right).
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# The dongle is always plugged in / on a desk — don't let it idle-sleep.
CONFIG_ZMK_SLEEP=n

# Prospector display options (see prospector-zmk-module README for the
# full list) — uncomment/adjust as needed:
# CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
# CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80
# CONFIG_PROSPECTOR_ROTATE_DISPLAY_180=y
# CONFIG_PROSPECTOR_STATUS_SCREEN_FIELD=y
